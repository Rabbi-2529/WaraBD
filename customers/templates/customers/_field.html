{# One form field in the shop's style. Usage: {% include "customers/_field.html" with field=form.phone %} #}
<div class="field{% if field.errors %} invalid{% endif %}{% if full %} full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="hint">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="err" role="alert">{{ error }}</div>{% endfor %}
</div>
