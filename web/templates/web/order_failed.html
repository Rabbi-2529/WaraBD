{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Not Completed | WaRa BD</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="{% static 'web/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'web/css/style.css' %}">
</head>
<body data-page="failed">
  <div id="site-header"></div>

  <main>
    <section class="section" style="padding-top:48px">
      <div class="container">
        <div class="steps-bar" aria-label="Checkout progress">
          <div class="sb-step done"><span class="n"><i data-icon="check"></i></span><span class="lbl">Cart</span></div>
          <div class="sb-line done"></div>
          <div class="sb-step current"><span class="n"><i data-icon="x"></i></span><span class="lbl">Checkout</span></div>
          <div class="sb-line"></div>
          <div class="sb-step"><span class="n">3</span><span class="lbl">Order complete</span></div>
        </div>
        <div class="result-wrap" id="resultMount"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  {% include "web/_products_bridge.html" %}
</body>
</html>
