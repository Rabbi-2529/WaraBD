{# web/templates/web/_site_config.html #}
{{ js_i18n|json_script:"wara-i18n" }}
<script>
  window.__WARA__ = window.__WARA__ || {};
  // Active language and the Bangla text for every T('...') string in app.js.
  window.__WARA__.lang = "{{ lang|default:'en' }}";
  window.__WARA__.i18n = JSON.parse(document.getElementById("wara-i18n").textContent || "{}");
  // Links built by Django, so Bangla pages keep their /bn/ prefix.
  window.__WARA__.urls = {
    home: "{% url 'web:home' %}",
    products: "{% url 'web:product_list' %}",
    portfolio: "{% url 'web:portfolio' %}",
    about: "{% url 'web:about' %}",
    contact: "{% url 'web:contact' %}",
    cart: "{% url 'web:cart' %}",
    checkout: "{% url 'web:checkout' %}",
    product: "{% url 'web:product_detail' '__slug__' %}",
    orderSuccess: "{% url 'web:order_success' '__slug__' %}",
    orderFailed: "{% url 'web:order_failed' %}",
    apiCheckout: "{% url 'web:api_checkout' %}",
    apiContact: "{% url 'web:api_contact' %}"
  };
  window.__WARA__.site = {
    name: "{{ site_settings.name|escapejs }}",
    phone: "{{ site_settings.phone|escapejs }}",
    whatsapp: "{{ site_settings.whatsapp|escapejs }}",
    email: "{{ site_settings.email|escapejs }}",
    address: "{{ site_settings.address|escapejs }}",
    mapQuery: "{{ site_settings.map_query|escapejs }}",
    hours: "{{ site_settings.hours|escapejs }}",
    announcement: "{{ site_settings.announcement|escapejs }}",
    merchant: {
      bkash: "{{ site_settings.bkash_number|escapejs }}",
      nagad: "{{ site_settings.nagad_number|escapejs }}"
    },
    social: {
      facebook: "{{ site_settings.facebook|escapejs }}",
      instagram: "{{ site_settings.instagram|escapejs }}",
      youtube: "{{ site_settings.youtube|escapejs }}"
    },
    delivery: {
      inside: {
        fee: Number("{{ site_settings.delivery_inside_fee|default:'0'|escapejs }}"),
        eta: "{{ site_settings.delivery_inside_eta|escapejs }}"
      },
      outside: {
        fee: Number("{{ site_settings.delivery_outside_fee|default:'0'|escapejs }}"),
        eta: "{{ site_settings.delivery_outside_eta|escapejs }}"
      }
    }
  };
</script>
