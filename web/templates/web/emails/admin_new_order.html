<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>New Order Received</title></head>
<body style="font-family: Arial, sans-serif; color: #333;">
  <h2 style="color: #d7182a;">New Order Received!</h2>
  <p>You have a new order on WaRa BD.</p>
  
  <table style="border-collapse: collapse; width: 100%; max-width: 500px;">
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>Order Number</strong></td><td style="padding: 8px; border: 1px solid #ddd;">{{ order.order_number }}</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>Customer</strong></td><td style="padding: 8px; border: 1px solid #ddd;">{{ order.full_name }}</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>Phone</strong></td><td style="padding: 8px; border: 1px solid #ddd;">{{ order.phone }}</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>Total</strong></td><td style="padding: 8px; border: 1px solid #ddd;">৳{{ order.total }}</td></tr>
  </table>
  
  <p style="margin-top: 20px;">Log in to the admin panel to view the full details and print the invoice.</p>
</body>
</html>
