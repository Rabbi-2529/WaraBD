{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | WaRa BD</title>
  <meta name="description" content="Shop WaRa smart security products in Bangladesh — keypad cabinet and drawer locks with cash on delivery and official warranty.">
  <link rel="icon" href="{% static 'web/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'web/css/style.css' %}">
</head>
<body data-page="products">
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="{% url 'web:home' %}">Home</a><span class="sep">/</span><span>Products</span></nav>
        <h1>Our Products</h1>
        <p>Genuine WaRa smart security products, delivered across Bangladesh.</p>
      </div>
    </section>

    <section class="section" style="padding-top:40px">
      <div class="container shop-layout">
        <aside class="shop-sidebar" id="shopSidebar" aria-label="Product filters">
          <div class="filter-box">
            <h3>Search</h3>
            <div class="shop-search">
              <input type="search" id="fSearch" placeholder="Search products…" aria-label="Search products">
            </div>
          </div>

          <div class="filter-box">
            <h3>Price Range</h3>
            <div class="range">
              <div class="range-track"><div class="range-fill"></div></div>
              <input type="range" id="fMin" aria-label="Minimum price">
              <input type="range" id="fMax" aria-label="Maximum price">
            </div>
            <div class="range-inputs">
              <input type="number" id="fMinNum" inputmode="numeric" aria-label="Minimum price (৳)">
              <input type="number" id="fMaxNum" inputmode="numeric" aria-label="Maximum price (৳)">
            </div>
          </div>

          <div class="filter-box">
            <h3>Categories</h3>
            <div id="fCats"></div>
          </div>

          <div class="filter-box">
            <h3>Availability</h3>
            <div id="fStock"></div>
          </div>

          <button type="button" class="btn btn-outline btn-block" id="fReset"><i data-icon="refresh"></i> Reset filters</button>
        </aside>

        <div>
          <div class="shop-toolbar">
            <button type="button" class="btn btn-dark btn-sm filter-toggle" id="filterToggle" aria-controls="shopSidebar" aria-expanded="false"><i data-icon="grid"></i> Filters</button>
            <p id="shopCount" aria-live="polite"></p>
            <select id="fSort" aria-label="Sort products">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name: A to Z</option>
              <option value="newest">Newest first</option>
            </select>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  {% include "web/_products_bridge.html" %}
</body>
</html>
